# Familienplaner – Beispielkonfiguration
# Kopieren nach /etc/familienplaner/config.yaml

server:
  host: 0.0.0.0
  port: 8000

database:
  path: /var/lib/familienplaner/familienplaner.db
  backup_dir: /var/lib/familienplaner/backups
  backup_keep: 14

security:
  secret_key_file: /etc/familienplaner/secret.key   # wird beim ersten Start erzeugt
  session_hours: 12
  # Admin-PIN wird beim ersten Start über die Weboberfläche gesetzt

locale:
  language: de
  timezone: Europe/Berlin
  week_starts_on: monday

display:
  mode: lcd            # lcd | eink
  default_view: week   # month | week | family
  theme: nordic               # Standard; änderbar in der Oberfläche
  # Offizielles Pi-Touch-Display: Hintergrundbeleuchtung direkt schalten
  # backlight_path: /sys/class/backlight/10-0045
  night_mode:
    enabled: true
    off: "22:30"
    on: "06:30"
  eink:
    driver: waveshare_13in3e   # waveshare_* | inky_impression
    layout: week               # week | family
    refresh_minutes: 15

sync:
  interval_minutes: 5
  past_days: 30
  future_days: 365

google:
  # Eigener OAuth-Client vom Typ "Desktop-App" (Anleitung: docs/GOOGLE_SETUP.md).
  # Alternativ leer lassen und in der Weboberfläche unter Einstellungen → Verknüpfte Konten eintragen.
  client_id: ""
  client_secret: ""
  # redirect_uri: http://127.0.0.1:8000/api/accounts/google/callback   # Standard

activities:
  home:
    address: ""        # wird geocodiert
    lat: null
    lon: null
  default_radius_km: 30
  refresh_hours: 12
  geocoder:
    provider: nominatim
    user_agent: familienplaner
  sources: []
  # Quellen werden normalerweise in der Weboberfläche angelegt. Einträge hier werden beim Start
  # einmalig übernommen (Name als Schlüssel). Beispiele:
  # - type: ical
  #   name: Stadt Veranstaltungen
  #   url: https://www.example-stadt.de/veranstaltungen.ics
  #   category: kids            # optional: Standardkategorie
  #   lat: 48.137               # optional: Ort für Termine ohne Adresse
  #   lon: 11.575
  # - type: rss
  #   name: Museum
  #   url: https://www.example-museum.de/feed.rss
  # - type: ticketmaster
  #   name: Ticketmaster
  #   api_key: "…"              # wird in der Datenbank verschlüsselt gespeichert
