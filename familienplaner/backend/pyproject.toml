[project]
name = "familienplaner"
version = "0.1.0"
description = "Familienplaner für Raspberry Pi – Backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "cryptography>=43",
  # Kalender
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "caldav>=1.4",
  "icalendar>=6.0",
  "python-dateutil>=2.9",
  # Activities
  "geopy>=2.4",
  "feedparser>=6.0",
  "selectolax>=0.3",
]

[project.optional-dependencies]
eink = ["playwright>=1.47", "pillow>=10.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
